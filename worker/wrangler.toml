name = "oh-scanada"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The Flutter web build, served from the same address as the API so there is one link to share.
[assets]
directory = "../build/web"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Each visitor gets a few AI requests a minute, so the OpenAI key can't be drained through the app.
[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# A site-wide count of AI requests per day, so the OpenAI key has a daily ceiling on top of its monthly cap.
[[kv_namespaces]]
binding = "SCANNER_USAGE"
id = "905ff423317a4e4d969a2c8e8d7237a8"

# The community board's posts, comments and likes. Local development uses a database in the .wrangler folder.
[[d1_databases]]
binding = "COMMUNITY"
database_name = "oh-scanada-community"
database_id = "dc770605-d654-40fa-bc97-7f9ad55635ff"

# Each visitor can make a few community changes a minute.
[[ratelimits]]
name = "COMMUNITY_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 15
  period = 60
